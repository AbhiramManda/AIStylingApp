version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ai_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: ai_backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      MINIO_ENDPOINT: http://ai_minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: style-images
      S3_BUCKET: ai-stylingapp-demo-bucket
      AWS_ACCESS_KEY_ID: AKIAXNEQLA4A2KEEOXOB
      AWS_SECRET_ACCESS_KEY: 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
      AWS_DEFAULT_REGION: us-east-1
      OPENAI_API_KEY: "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"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: ai_frontend
    depends_on:
    - backend
    ports:
      - "8080:80"

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web Console
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:

