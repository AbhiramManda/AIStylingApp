apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-styling-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-styling-frontend
  template:
    metadata:
      labels:
        app: ai-styling-frontend
    spec:
      containers:
        - name: frontend
          image: your-dockerhub-username/ai-styling-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: ai-styling-frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
